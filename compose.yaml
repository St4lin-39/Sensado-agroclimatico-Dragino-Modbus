services:

  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    restart: unless-stopped

    ports:
      - "8086:8086"

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}

    volumes:
      - influxdb-data:/var/lib/influxdb2

    networks:
      - iot-network


  node-red:
    build:
      context: ./node-red
      dockerfile: Dockerfile

    container_name: iot-node-red
    restart: unless-stopped

    ports:
      - "1880:1880"

    volumes:
      - node-red-data:/data

    networks:
      - iot-network

    depends_on:
      - influxdb


  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/sensado_agroclimatico/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards

    networks:
      - iot-network

    depends_on:
      - influxdb


networks:

  iot-network:
    name: iot-agricola-network
    driver: bridge


volumes:

  influxdb-data:
    name: iot-agricola-influxdb-data

  grafana-data:
    name: iot-agricola-grafana-data

  node-red-data:
    name: iot-agricola-node-red-data